# =============================================================================
# EstateVista India - Multi-Container Docker Compose Setup
# Services:
#   1. app: PHP 8.2 + Apache web server (Port 8080)
#   2. db: MySQL 8.0 with automatic schema & seed data initialization (Port 3307)
#   3. phpmyadmin: Visual Database Management Interface (Port 8081)
# =============================================================================

version: '3.8'

services:
  # PHP + Apache Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estatevista_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: estatevista_db
      DB_USER: estatevista_user
      DB_PASS: estatevista_pass
      DB_CHARSET: utf8mb4
      SITE_URL: "http://localhost:8080"
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  # MySQL 8.0 Relational Database Server
  db:
    image: mysql:8.0
    container_name: estatevista_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estatevista_db
      MYSQL_USER: estatevista_user
      MYSQL_PASSWORD: estatevista_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # phpMyAdmin Web GUI
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: estatevista_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
